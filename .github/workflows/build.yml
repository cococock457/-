name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files
        run: |
          set -e
          R=app/src/main/res
          mkdir -p $R/layout $R/drawable $R/xml $R/mipmap-xxxhdpi
          python3 - <<'PY'
          import hashlib, os, shutil, sys

          H = {
              "AlarmReceiver": "6b8e1b0c1febf18a9ec20fd06ce76d41b1ec9427a8507767db1010c4247ed197",
              "AlarmWidget": "4e7bcc3bad559f0935b25b9103c64e57507e335b9fc277e76857bc54b42f5a98",
              "AlertListener": "a3dc005b21b299c2ccb7bf20b010a5a4676556e3175f47d39d6ef2771a43c9be",
              "BootReceiver": "7bc3cd4630d755e5e86a379498e8e95bb43e6657b30ed7a91e34b95b43462359",
              "MainActivity": "e1825c59250a636ceacf38bd9d6d16b72178ba4ff703cae75371e603150495c0",
              "Notif": "74ac6ba9c9bd30979163ce768f0e517f98a9a6d7efe283447d38676644223f6c",
              "Poller": "55097598e00e6d13f5a877274dd9c2f25a6629ab1bda03303627f91756a99a76",
              "RingService": "baf443512c356f1766ad1d6d516c28be60251b23fa6fab57ce1f8e2fb703c4d5",
              "Scheduler": "b59803a0e0789d34880f4dcf5e6e8be5a300ebff223d45d14503ae84e8020a74",
              "Store": "1eb1b0b4adb4d91d636f90f0d7240a040332f29f49b4242ed1453f19630472bd"
          }

          def h(b):
              return hashlib.sha256(b.replace(b"\r\n", b"\n")).hexdigest()

          D = "app/src/main/java/ua/trevogaalarm"
          os.makedirs(D, exist_ok=True)
          found = {}
          for f in sorted(os.listdir(".")):
              if os.path.isfile(f) and f.lower().endswith(".kt"):
                  d = h(open(f, "rb").read())
                  for n, v in H.items():
                      if d == v and n not in found:
                          found[n] = f
          missing = [n for n in H if n not in found]
          if missing:
              print("ERROR: no matching file in repo root for:", ", ".join(missing))
              print("Kotlin files in root:", [f for f in os.listdir(".") if f.endswith(".kt")])
              sys.exit(1)
          for n, f in found.items():
              print(n, "<-", f)
              shutil.copy(f, D + "/" + n + ".kt")
          PY
          if [ ! -f ic_launcher.png ]; then echo "ERROR: ic_launcher.png not found"; exit 1; fi
          cp ic_launcher.png $R/mipmap-xxxhdpi/ic_launcher.png
          mkdir -p .
          cat > build.gradle.kts <<'EOF_0'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_0
          mkdir -p .
          cat > settings.gradle.kts <<'EOF_1'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TrevogaAlarm"
          include(":app")
          EOF_1
          mkdir -p .
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2048m
          android.nonTransitiveRClass=true
          EOF_2
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "ua.trevogaalarm"
              compileSdk = 34
              defaultConfig {
                  applicationId = "ua.trevogaalarm"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Тривога-будильник"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver android:name=".AlarmReceiver" android:exported="false" />

                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>

                  <receiver android:name=".PollReceiver" android:exported="false" />

                  <receiver android:name=".AlarmWidget" android:exported="false">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_alarm_info" />
                  </receiver>

                  <service
                      android:name=".RingService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />

                  <service
                      android:name=".AlertListener"
                      android:exported="true"
                      android:label="Тривога-будильник"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/widget_bg_ok.xml <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="315"
                  android:startColor="#4FD1B5"
                  android:endColor="#2B8FA8" />
              <corners android:radius="24dp" />
          </shape>
          EOF_5
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/widget_bg_alert.xml <<'EOF_6'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="315"
                  android:startColor="#F25C54"
                  android:endColor="#9B1C31" />
              <corners android:radius="24dp" />
          </shape>
          EOF_6
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/widget_alarm.xml <<'EOF_7'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/w_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:padding="16dp"
              android:background="@drawable/widget_bg_ok">

              <TextView
                  android:id="@+id/w_icon"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textSize="34sp"
                  android:text="✅" />

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:paddingStart="14dp">

                  <TextView
                      android:id="@+id/w_title"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textSize="18sp"
                      android:textStyle="bold"
                      android:textColor="#FFFFFF"
                      android:maxLines="1"
                      android:text="Тривоги немає" />

                  <TextView
                      android:id="@+id/w_sub"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:textSize="13sp"
                      android:textColor="#E6FFFFFF"
                      android:maxLines="1"
                      android:text="" />
              </LinearLayout>
          </LinearLayout>
          EOF_7
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/widget_alarm_info.xml <<'EOF_8'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="70dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_alarm"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF_8
          find app -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
