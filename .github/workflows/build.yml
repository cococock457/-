name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Arrange files
        run: |
          ls -la
          python3 - <<'PY'
          import os, re, subprocess

          def ct(f):
              r = subprocess.run(["git", "log", "-1", "--format=%ct", "--", f], capture_output=True, text=True).stdout.strip()
              return int(r or 0)

          def read(f):
              return open(f, encoding="utf-8", errors="ignore").read()

          def put(src, dst):
              data = read(src)
              os.makedirs(os.path.dirname(dst) or ".", exist_ok=True)
              with open(dst, "w", encoding="utf-8") as o:
                  o.write(data)

          def pick(c):
              c = sorted(c, key=lambda f: (ct(f), f))
              return c[-1] if c else None

          def norm(f):
              m = re.match(r"^(.*?)(?:-\d+)+(\.[A-Za-z0-9]+)$", f)
              return m.group(1) + m.group(2) if m else f

          files = [f for f in os.listdir(".") if os.path.isfile(f) and not f.startswith("v2_")]
          groups = {}
          for f in files:
              groups.setdefault(norm(f), []).append(f)

          D = "app/src/main/java/ua/trevogaalarm"
          R = "app/src/main/res"

          kt = {n: pick(c) for n, c in groups.items() if n.endswith(".kt")}
          if "MainActivity.kt" not in kt:
              raise SystemExit("ERROR: MainActivity.kt not found")
          for n, src in kt.items():
              print("kt", n, "<-", src)
              put(src, D + "/" + n)

          if "AndroidManifest.xml" not in groups:
              raise SystemExit("ERROR: AndroidManifest.xml not found")
          src = pick(groups["AndroidManifest.xml"])
          print("manifest <-", src)
          put(src, "app/src/main/AndroidManifest.xml")

          res = {
              "widget_alarm.xml": "layout",
              "widget_bg_ok.xml": "drawable",
              "widget_bg_alert.xml": "drawable",
              "widget_alarm_info.xml": "xml",
          }
          for n, d in res.items():
              if n not in groups:
                  raise SystemExit("ERROR: " + n + " not found")
              src = pick(groups[n])
              print("res", n, "<-", src)
              put(src, R + "/" + d + "/" + n)

          k = [f for f in files if f.endswith(".kts")]
          for cond, dst in [("apply false", "build.gradle.kts.tmp"), ("namespace", "app/build.gradle.kts"), ("rootProject.name", "settings.gradle.kts.tmp")]:
              s = pick([f for f in k if cond in read(f)])
              if not s:
                  raise SystemExit("ERROR: missing gradle file with " + cond)
              print(cond, "<-", s)
              put(s, dst)
          os.replace("build.gradle.kts.tmp", "build.gradle.kts")
          os.replace("settings.gradle.kts.tmp", "settings.gradle.kts")

          if not os.path.exists("ic_launcher.png"):
              raise SystemExit("ERROR: ic_launcher.png not found")
          os.makedirs(R + "/mipmap-xxxhdpi", exist_ok=True)
          with open("ic_launcher.png", "rb") as a, open(R + "/mipmap-xxxhdpi/ic_launcher.png", "wb") as b:
              b.write(a.read())
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
