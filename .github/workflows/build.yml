name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Arrange files
        run: |
          ls -la
          python3 - <<'PY'
          import os, re, subprocess

          def ct(f):
              r = subprocess.run(["git", "log", "-1", "--format=%ct", "--", f], capture_output=True, text=True).stdout.strip()
              return int(r or 0)

          def read(f):
              return open(f, encoding="utf-8", errors="ignore").read()

          def put(src, dst):
              data = read(src)
              os.makedirs(os.path.dirname(dst) or ".", exist_ok=True)
              with open(dst, "w", encoding="utf-8") as o:
                  o.write(data)

          def pick(c):
              c = sorted(c, key=lambda f: (ct(f), f))
              return c[-1] if c else None

          files = [f for f in os.listdir(".") if os.path.isfile(f)]
          D = "app/src/main/java/ua/trevogaalarm"
          for n in ["AlarmReceiver", "AlertListener", "BootReceiver", "MainActivity", "Notif", "RingService", "Scheduler", "Store", "Widget"]:
              c = [f for f in files if f.lower().endswith(".kt") and n.lower() in f.lower() and re.search(r"(class|object)\s+" + n + r"\b", read(f))]
              b = pick(c)
              if not b:
                  raise SystemExit("ERROR: missing or empty file for " + n)
              print(n, "<-", b)
              put(b, D + "/" + n + ".kt")

          m = pick([f for f in files if f.endswith(".xml") and "<manifest" in read(f)])
          if not m:
              raise SystemExit("ERROR: missing AndroidManifest.xml")
          put(m, "app/src/main/AndroidManifest.xml")

          k = [f for f in files if f.endswith(".kts")]
          for cond, dst in [("apply false", "build.gradle.kts.tmp"), ("namespace", "app/build.gradle.kts"), ("rootProject.name", "settings.gradle.kts.tmp")]:
              s = pick([f for f in k if cond in read(f)])
              if not s:
                  raise SystemExit("ERROR: missing gradle file with " + cond)
              print(cond, "<-", s)
              put(s, dst)
          os.replace("build.gradle.kts.tmp", "build.gradle.kts")
          os.replace("settings.gradle.kts.tmp", "settings.gradle.kts")
          PY

      - name: Inject API key
        env:
          ALERTS_API_KEY: ${{ secrets.ALERTS_API_KEY }}
        run: |
          if [ -z "$ALERTS_API_KEY" ]; then echo "WARNING: secret ALERTS_API_KEY is empty, API check disabled"; fi
          printf 'package ua.trevogaalarm\n\nobject Secrets {\n    const val ALERTS_KEY = "%s"\n}\n' "$ALERTS_API_KEY" > app/src/main/java/ua/trevogaalarm/Secrets.kt

      - name: App icon
        run: |
          mkdir -p app/src/main/res/mipmap-xxhdpi
          cp ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png

      - name: Widget resources
        run: |
          mkdir -p app/src/main/res/layout app/src/main/res/xml
          cat > app/src/main/res/layout/widget.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/w_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#E6222222"
              android:padding="12dp"
              android:orientation="vertical">
              <TextView
                  android:id="@+id/w_text"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="#FFFFFF"
                  android:textSize="15sp"
                  android:text="Тривога-будильник" />
          </LinearLayout>
          EOF
          cat > app/src/main/res/xml/widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="70dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
